<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求職投遞手帳</title>
<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#1f2a24; --muted:#6f756d; --line:#ded5c3;
  --green:#2f5d4a; --green-soft:#dfeae2; --tomato:#d2553a; --mustard:#e2a83b;
  --sky:#3d6fa8; --plum:#7a4d78; --gray:#8a8a82;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --mono:"Cascadia Mono","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;
  background-image:radial-gradient(circle at 1px 1px,rgba(47,93,74,.08) 1px,transparent 0);background-size:22px 22px}
.wrap{max-width:1180px;margin:0 auto;padding:36px 24px 90px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--tomato);text-transform:uppercase}
h1{font-family:var(--serif);font-size:42px;margin:6px 0 0;font-weight:900;letter-spacing:.02em}
h1 span{color:var(--green)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font-family:var(--sans);font-size:13px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:999px;cursor:pointer;transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.primary{background:var(--green);color:#fff;border-color:var(--green)}
.plum{background:var(--plum);color:#fff;border-color:var(--plum)}
.ghost{border-color:var(--line)}
input[type=file]{display:none}

/* backup reminder */
.backup{display:none;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:12px 16px;border:1.5px dashed var(--mustard);background:#fdf5e2;border-radius:14px;font-size:13px}
.backup.show{display:flex}
.backup b{font-family:var(--serif)}
.backup button{padding:6px 12px;font-size:12.5px}
.backup .later{border:none;background:none;color:var(--muted);padding:6px}
.backup .later:hover{box-shadow:none;transform:none;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;margin:22px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.stat.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.stat .n{font-family:var(--serif);font-size:32px;font-weight:900;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;margin-bottom:20px;background:var(--line)}
.bar div{transition:width .4s}

.upcoming{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.upcoming .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--plum)}
.chip{background:var(--card);border:1.5px solid var(--plum);border-radius:12px;padding:7px 12px;font-size:12.5px;cursor:pointer}
.chip b{font-family:var(--mono);color:var(--plum);margin-right:6px}
.chip:hover{box-shadow:3px 3px 0 var(--plum)}
.chip.attn{border-color:var(--tomato);color:var(--tomato);font-weight:600}
.chip.attn.on{background:var(--tomato);color:#fff}
.chip.attn:hover{box-shadow:3px 3px 0 var(--tomato)}
.chip.ics{border-color:var(--line);color:var(--ink)}
.chip.ics:hover{box-shadow:3px 3px 0 var(--ink)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.views{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.views button{border:none;border-radius:0;padding:9px 16px}
.views button:hover{box-shadow:none;transform:none;background:#f1ebdf}
.views button.on{background:var(--ink);color:#fff}
.search{flex:1;min-width:200px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:14px;font-family:var(--sans)}
.search:focus{outline:none;border-color:var(--green)}
select.sort{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 12px;font-family:var(--sans)}

/* table */
.table-wrap{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-align:left;color:var(--muted);font-weight:500;padding:12px 14px;border-bottom:1.5px solid var(--ink);background:#faf6ec;white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th[data-sort]::after{content:'↕';margin-left:5px;opacity:.3}
th.asc::after{content:'↑';opacity:1;color:var(--green)}
th.desc::after{content:'↓';opacity:1;color:var(--green)}
th.asc,th.desc{color:var(--ink)}
td{padding:12px 14px;border-bottom:1px dashed var(--line);vertical-align:middle}
.nil{color:#cdc5b5}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.flags .flag{margin-left:0}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fbf7ee}
.co{font-weight:700;font-size:15px}
.co a{color:var(--sky);font-weight:400;font-size:12px;margin-left:6px;text-decoration:none}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.date{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.days{font-size:11px;color:var(--muted)}
.warn{color:var(--tomato)!important;font-weight:600}
.pill{appearance:none;-webkit-appearance:none;border:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);text-align:center;text-align-last:center;min-width:76px}
.pill option{text-align:left}
.note{max-width:240px;color:#454c46;font-size:13px;line-height:1.5;white-space:pre-line}
.next{font-size:12.5px}
.next b{font-family:var(--mono);font-weight:600;color:var(--plum)}
.flag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:#f6e0da;color:#c04a31;margin-left:4px}
.flag.today{background:#f8ecd2;color:#a8721a}
.row-act{white-space:nowrap}
.row-act button{padding:5px 9px;font-size:12px;border-color:var(--line)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:24px;color:var(--ink);margin-bottom:8px}
.inb{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;background:var(--plum);color:#fff}
th.ck,td.ck{width:36px;padding-right:0}
input.cb{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
tbody tr.sel{background:var(--green-soft)}
tbody tr.sel:hover{background:#d3e3d8}
.iv-cell{font-size:12.5px;line-height:1.55;white-space:nowrap}
.iv-cell .rd{font-weight:700}
.iv-cell .when{font-family:var(--mono);font-size:12px}
.iv-cell .when.up{color:var(--plum);font-weight:600}
.res{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;margin-left:4px}
.res-通過{background:var(--green-soft);color:var(--green)}
.res-未通過{background:#f6e0da;color:#c04a31}

/* three equal-weight columns so the page numbers stay centred whatever the left text says */
.pager{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--muted)}
.pager>div:last-child{justify-self:end}
@media (max-width:640px){.pager{grid-template-columns:minmax(0,1fr)}.pager>div{justify-self:center!important;text-align:center}}
.pager .pages{display:flex;gap:4px;align-items:center}
.pager .pg{min-width:34px;height:34px;padding:0 10px;justify-content:center;border-color:var(--line);font-family:var(--mono);font-size:12.5px}
.pager .pg.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
.pager .pg:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.pager select{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 10px;font-family:var(--sans);margin:0 4px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.col{background:rgba(255,253,248,.6);border:1.5px solid var(--line);border-radius:16px;padding:8px;min-height:200px;min-width:0;display:flex;flex-direction:column;transition:background .15s,border-color .15s}
.col.over{background:var(--green-soft);border-color:var(--green);border-style:dashed}
.col-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 4px 8px;border-bottom:1.5px solid var(--line);margin-bottom:8px;white-space:nowrap}
.col-h .c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.col-body{display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 220px);min-height:120px;overflow-y:auto;padding:0 2px 2px;scrollbar-width:thin}
.col-more{margin-top:8px;justify-content:center;font-size:12px;padding:6px 10px;border-color:var(--line);color:var(--muted)}
.drops{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:12px;border-top:1.5px dashed var(--line)}
.drops-h{font-size:11px;font-family:var(--mono);letter-spacing:.1em;color:var(--muted);margin-right:4px;white-space:nowrap}
.drop{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 10px;border:1.5px dashed var(--line);border-radius:12px;background:rgba(255,253,248,.6);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.drop .c{font-family:var(--mono);color:var(--muted);font-size:12px;font-weight:500}
.drop:hover{border-color:var(--ink)}
.drop.over{background:var(--green-soft);border-color:var(--green);transform:scale(1.02)}
.col-body.empty{align-items:center;justify-content:center;min-height:90px}
.col-body.empty::after{content:'拖到這裡';font-size:12px;color:#cdc5b5}
.col{min-height:0!important}
.card{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--sky);border-radius:10px;padding:8px 9px;cursor:grab;font-size:12px;line-height:1.45;min-width:0}
.card:hover{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.card.dragging{opacity:.4}
.card .t{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3b443e}
.card .m{color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.slim{padding:6px 9px}
.card.slim .m{display:none}
.kb-hint{font-size:12px;color:var(--muted);margin:0 0 10px}

/* analytics */
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:18px 20px;min-width:0}
.panel h3{font-family:var(--serif);font-size:18px;margin:0 0 4px}
.panel .desc{font-size:12px;color:var(--muted);margin:0 0 14px}
.panel.full{grid-column:1/-1}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fstep{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.fstep .n{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1}
.fstep .l{font-size:12px;color:var(--muted);margin-top:4px}
.fstep .r{font-family:var(--mono);font-size:12px;margin-top:8px;color:var(--ink)}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:10px;align-items:center;margin-bottom:8px;font-size:12.5px;position:relative}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:14px;position:relative}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--green)}
.hbar .fill.ghost{background:#c9d9ce}
.hbar .v{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.hbar:hover .nm{font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.weeks{display:flex;align-items:flex-end;gap:2px;height:160px;border-bottom:1px solid var(--line);position:relative}
.wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.wk .b{background:var(--green);border-radius:4px 4px 0 0;min-height:0}
.wk:hover .b{background:#24493a}
.wk .lbl{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;z-index:50;opacity:0;transition:opacity .1s;white-space:nowrap}
.tip.show{opacity:1}
.an-table{width:100%;min-width:0;font-size:12.5px;margin-top:6px}
.an-table td,.an-table th{padding:7px 8px}

/* dialogs */
dialog{border:2px solid var(--ink);border-radius:18px;padding:0;width:min(800px,95vw);max-height:92vh;background:var(--card);box-shadow:8px 8px 0 var(--ink)}
dialog.small{width:min(440px,92vw)}
dialog[open]{display:flex}
dialog::backdrop{background:rgba(31,42,36,.35)}
dialog form{display:flex;flex-direction:column;width:100%;max-height:calc(92vh - 4px)}
.dlg-body{overflow:auto;flex:1}
.dlg-h{padding:18px 22px;border-bottom:1.5px dashed var(--line);font-family:var(--serif);font-size:22px;font-weight:900}
.dlg-h.inbound{color:var(--plum)}
form .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;padding:18px 22px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
label.full{grid-column:1/-1}
label input,label select,label textarea{font-family:var(--sans);font-size:14px;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--green)}
textarea{resize:vertical;min-height:70px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:14px 22px;border-top:1.5px dashed var(--line)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg label{flex:1;flex-direction:row;justify-content:center;align-items:center;padding:9px 6px;font-size:13.5px;color:var(--ink);cursor:pointer;gap:6px}
.seg input{display:none}
.seg label:first-child:has(input:checked){background:var(--green);color:#fff}
.seg label:last-child:has(input:checked){background:var(--plum);color:#fff}
.iv-sec{margin:0 22px 18px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:#fbf8f1}
.iv-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--serif);font-weight:900;font-size:16px;margin-bottom:10px}
.iv-h button{padding:6px 12px;font-size:12px}
.iv-row{display:grid;grid-template-columns:88px minmax(0,1.1fr) 92px 78px 90px minmax(0,1.5fr) 28px 28px;gap:6px;margin-bottom:6px;align-items:center}
.iv-row input,.iv-row select{font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;min-width:0;width:100%}
.iv-row .ic{border:none;background:none;font-size:15px;padding:0;cursor:pointer;justify-content:center}
.iv-row .ic:hover{box-shadow:none;transform:scale(1.15)}
.iv-row .rm{color:var(--tomato)}
.iv-empty{font-size:12.5px;color:var(--muted);padding:4px 2px}
.bd-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px}

/* suggestion banner */
.backup.sugg{border-color:var(--sky);background:#e9f0f8}
/* analytics ignores filters, so hide the controls that would look like they apply */
body.v-stats #stats,body.v-stats #bar,body.v-stats #upcoming,body.v-stats #q,body.v-stats #originF{display:none}
/* with the cards gone, keep the same gap under the header */
body.v-stats .toolbar{margin-top:22px;margin-bottom:16px}
.chip.offer{border-color:var(--green);color:var(--green);font-weight:600}
.chip.offer:hover{box-shadow:3px 3px 0 var(--green)}
.chip.ghost{border-color:var(--sky);color:var(--sky);font-weight:600;background:#e9f0f8}
/* offer comparison */
.cmp-wrap{overflow:auto;padding:16px 22px}
.cmp{width:100%;min-width:0;border-collapse:separate;border-spacing:0}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px dashed var(--line);vertical-align:top;font-size:13px;line-height:1.55;white-space:pre-line}
.cmp thead th{font-family:var(--serif);font-size:17px;color:var(--ink);letter-spacing:0;background:var(--green-soft);border-bottom:1.5px solid var(--ink);min-width:170px}
.cmp tbody th{font-family:var(--sans);font-size:12px;color:var(--muted);background:transparent;width:90px;border-bottom:1px dashed var(--line)}
.cmp .money{font-family:var(--serif);font-size:18px;font-weight:900;color:var(--green)}

/* bulk bar */
.bulk{position:fixed;left:50%;bottom:60px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;
  border-radius:999px;padding:8px 10px 8px 20px;display:flex;align-items:center;gap:8px;box-shadow:5px 5px 0 var(--green);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),opacity .2s,visibility 0s .25s;z-index:20;flex-wrap:wrap;max-width:94vw}
.bulk.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;pointer-events:auto;
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),opacity .2s,visibility 0s}
.bulk .cnt{font-family:var(--serif);font-weight:900;font-size:16px;margin-right:6px;white-space:nowrap}
.bulk select,.bulk button{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 12px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
.bulk select option{color:var(--ink)}
.bulk button:hover{box-shadow:none;border-color:#fff;transform:none}
.bulk .danger{border-color:var(--tomato);color:#ffb5a5}
.bulk .x{border:none;font-size:16px;padding:4px 10px}

.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-20px);z-index:60;background:var(--ink);color:#fff;padding:8px 8px 8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:12px;min-height:38px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast:not(.has-act){padding-right:18px}
.toast button{background:var(--mustard);border:none;color:var(--ink);font-weight:700;padding:5px 12px;font-size:12.5px}
.toast button:hover{box-shadow:none;transform:none;background:#f0bd5a}
.errbar{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:min(760px,94vw);
  background:#fdecea;border:2px solid var(--tomato);color:#8f2a17;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:4px 4px 0 var(--tomato);font-size:13px}
.errbar span{font-family:var(--mono);font-size:12px;color:var(--ink);word-break:break-all}
.errbar small{color:var(--muted)}
.errbar button{border:none;background:none;color:#8f2a17;font-size:15px;padding:2px 6px;margin-left:auto}
.errbar button:hover{box-shadow:none;transform:none}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
.hint code{font-family:var(--mono);background:#efe8d8;padding:1px 6px;border-radius:4px}
[hidden]{display:none!important}

@media (max-width:820px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}h1{font-size:32px}.an-grid{grid-template-columns:minmax(0,1fr)}.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}.kanban{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (max-width:640px){.iv-row{grid-template-columns:1fr 1fr}}
.kb-m{display:none}
.kb-tabs,.kb-move{display:none}

/* ---------- Phone layout ---------- */
@media (max-width:640px){
  .wrap{padding:20px 14px 96px}
  header{gap:14px;padding-bottom:14px}
  h1{font-size:28px}
  .actions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:8px}
  .actions>*{justify-content:center;padding:11px 8px}
  .backup{flex-direction:column;align-items:stretch}
  .backup button{justify-content:center}

  /* status cards and chips scroll sideways instead of stacking */
  .stats{display:flex;overflow-x:auto;gap:8px;margin:16px -14px 12px;padding:2px 14px 6px;scrollbar-width:none}
  .stats::-webkit-scrollbar,.upcoming::-webkit-scrollbar,.kanban::-webkit-scrollbar{display:none}
  .stat{flex:0 0 auto;min-width:86px;padding:10px 12px}
  .stat .n{font-size:24px}
  .bar{margin-bottom:14px}
  .upcoming{flex-wrap:nowrap;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 6px;scrollbar-width:none}
  .upcoming>*{flex:0 0 auto;white-space:nowrap}

  .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .views{grid-column:1/-1}
  .views button{flex:1;justify-content:center;padding:10px 6px}
  .search{min-width:0;font-size:16px}

  /* table rows become cards */
  .table-wrap{background:none;border:none;border-radius:0;overflow:visible}
  table{min-width:0;display:block}
  colgroup,thead{display:none}
  tbody{display:flex;flex-direction:column;gap:10px}
  tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;position:relative;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px 14px 44px}
  tbody tr.sel{border-color:var(--green);background:var(--green-soft)}
  tbody tr:has(td[colspan]){display:block;padding:0}
  td{display:block;padding:0;border:none;min-width:0}
  td[data-label]::before{content:attr(data-label);display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
  td[data-label]:has(> .nil:only-child){display:none}
  td.ck{position:absolute;left:14px;top:16px;width:auto}
  td.c-co{grid-column:1/-1;padding-right:64px}
  td.row-act{position:absolute;right:12px;top:11px}
  td.row-act button{padding:7px 12px}
  td.next,td.note{grid-column:1/-1}
  .note{max-width:none}
  .iv-cell{white-space:normal}
  input.cb{width:20px;height:20px}

  /* board: tabs pick one status at a time; each card has its own "move to" menu since touch can't drag */
  .kb-d{display:none}.kb-m{display:inline}
  .kb-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:4px 14px 6px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--paper)}
  .kb-tabs::-webkit-scrollbar{display:none}
  .kb-tabs button{flex:0 0 auto;padding:8px 12px;border-color:var(--line);font-size:13px;gap:6px}
  .kb-tabs button:hover{transform:none;box-shadow:none}
  .kb-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .kb-tabs .c{font-family:var(--mono);font-size:11.5px;opacity:.75}
  .kanban{display:block!important;margin:0;padding:0;overflow:visible}
  .kanban>.col{display:none;background:none;border:none;padding:0}
  .kanban>.col.active{display:flex}
  .kanban>.col .col-h{display:none}
  .col-body{max-height:none;overflow:visible;gap:8px;padding:0}
  .col-body.empty{min-height:120px;border:1.5px dashed var(--line);border-radius:14px}
  .col-body.empty::after{content:'這個狀態目前沒有紀錄'}
  .drops{display:none}
  .card{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center;cursor:pointer;padding:12px 12px 12px 14px;border-radius:12px}
  .card>*{grid-column:1}
  .card .t{font-size:15px;white-space:normal}
  .card .p{white-space:normal}
  .card.slim .m{display:block}
  .kb-move{display:block;grid-column:2;grid-row:1/span 5;font-family:var(--sans);font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:8px 10px;background:#fff;color:var(--ink);max-width:96px}

  /* analytics */
  .panel{padding:14px}
  .hbar{grid-template-columns:70px minmax(0,1fr) 84px;gap:8px;font-size:12px}
  .weeks{height:120px}
  .wk .lbl{font-size:9px}

  /* dialogs become full-screen sheets */
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:none;border-radius:0;box-shadow:none}
  dialog form{max-height:100dvh;height:100%}
  dialog.small{width:92vw;height:auto;max-height:90dvh;margin:auto;border:2px solid var(--ink);border-radius:16px}
  .dlg-h{padding:14px 16px;font-size:19px;position:sticky;top:0;background:var(--card);z-index:1}
  form .grid{grid-template-columns:minmax(0,1fr);padding:14px 16px}
  label input,label select,label textarea{font-size:16px}
  .iv-sec{margin:0 16px 16px;padding:12px}
  .iv-h{flex-wrap:wrap;gap:6px}
  .iv-h .sub{order:3;width:100%;margin:0!important}
  .iv-row{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
  .iv-row input,.iv-row select{font-size:16px;padding:9px 8px}
  .iv-row [data-k=note]{grid-column:1/-1}
  .iv-row .ic{height:36px;border:1px solid var(--line);border-radius:8px}
  .dlg-f{padding:12px 16px;position:sticky;bottom:0;background:var(--card)}
  .dlg-f button{padding:11px 16px}
  .cmp-wrap{padding:12px}

  /* bulk bar spans the bottom and scrolls if it has to */
  .bulk{left:8px;right:8px;bottom:56px;max-width:none;transform:translateY(30px);border-radius:16px;padding:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .bulk.show{transform:none}
  .bulk>*{flex:0 0 auto}
  .toast{max-width:92vw;font-size:12.5px}
}

@media print{
  .actions,.toolbar,.row-act,.hint,.bar,.bulk,.ck,.pager,.backup,.upcoming,.toast{display:none!important}
  .wrap{padding:0}
  .table-wrap{overflow:visible;border-radius:0}
  table{min-width:0;font-size:11px}
  .kanban{grid-template-columns:repeat(7,minmax(0,1fr))}
  .col-body{max-height:none;overflow:visible}
  .col-more{display:none!important}
  .panel{break-inside:avoid}
  @page{size:A4 landscape;margin:12mm}
}

window.addEventListener('error',e=>showErr(`${e.message||'未知錯誤'}${e.lineno?`（第 ${e.lineno} 行）`:''}`));
window.addEventListener('unhandledrejection',e=>showErr(String(e.reason&&e.reason.message||e.reason)));

<script>
/* ---------- Constants ---------- */
const STATUSES=[
  {k:'邀約洽談',c:'#7a4d78',bg:'#efe3f0'},
  {k:'已投遞',c:'#3d6fa8',bg:'#e1eaf5'},
  {k:'面試中',c:'#a8721a',bg:'#f8ecd2'},
  {k:'等待結果',c:'#2a7f86',bg:'#dcefef'},
  {k:'錄取',c:'#2f5d4a',bg:'#dfeae2'},
  {k:'未錄取',c:'#c04a31',bg:'#f6e0da'},
  {k:'無回應',c:'#6f756d',bg:'#ebe8e0'}
];
const CLOSED=['錄取','未錄取','無回應'];
const FIELDS=['company','position','origin','date','channel','status','location','salary','contact','next','nextDate','link','note'];
const LABELS={company:'公司',position:'職位',origin:'來源類型',date:'日期',channel:'管道',status:'狀態',location:'地點',salary:'薪資',contact:'聯絡人',next:'下一步',nextDate:'下一步日期',link:'連結',note:'備註'};
const ALIASES={
  company:['公司','公司名稱','企業','company','company name'],
  position:['職位','職缺','職稱','應徵職位','position','title','job','role','job title'],
  origin:['來源類型','類型','投遞類型','主被動','主動/被動','origin','type'],
  date:['投遞日期','日期','聯繫日期','邀約日期','應徵日期','申請日期','投遞時間','date','applied','applied date','apply date'],
  channel:['管道','來源','平台','渠道','channel','source','platform'],
  status:['狀態','進度','結果','status','stage'],
  location:['地點','地區','工作地點','location','city'],
  salary:['薪資','薪水','待遇','salary','pay'],
  contact:['聯絡人','聯絡窗口','hr','contact','recruiter'],
  next:['下一步','待辦','next','next step','todo'],
  nextDate:['下一步日期','next date'],
  link:['連結','網址','職缺連結','link','url'],
  note:['備註','筆記','心得','note','notes','memo','remark']
};
const ROUNDS=['筆試/測驗','一面','二面','三面','四面','主管面','HR面','終面'];
const MODES=['線上','現場','電話'];
const RESULTS=['待面試','等結果','通過','未通過'];
const WD='日一二三四五六';
const KEY='job-tracker-v1';

/* ---------- State ---------- */
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
// older versions stored unknown interview times as midnight; treat those as date-only
data.forEach(d=>(d.interviews||[]).forEach(iv=>{if(/T00:00$/.test(iv.when||''))iv.when=iv.when.slice(0,10)}));
let filter=null, attnOnly=false, editingId=null, visibleIds=[], view='table';
let page=1, pageSize=+localStorage.getItem(KEY+'-pagesize')||20;
let sortKey='date', sortDir=-1;
let ghostOnly=false, hiddenClosed=0;
const selected=new Set();

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=k=>STATUSES.find(s=>s.k===k)||STATUSES[1];
const org=d=>d.origin==='公司邀約'?'公司邀約':'主動投遞';
const pad=n=>String(n).padStart(2,'0');
// all dates use the browser's local time zone, not UTC
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
function parseDay(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null}
function daysSince(s){const t=parseDay(s);if(!t)return null;const now=new Date();now.setHours(0,0,0,0);return Math.round((now-t)/864e5)}
// interview times are "YYYY-MM-DDTHH:MM", or just "YYYY-MM-DD" when the time is unknown
const hasTime=s=>/T\d/.test(s||'');
const ivStart=s=>hasTime(s)?new Date(s):parseDay(s);
const fmtDT=s=>s?(hasTime(s)?s.replace('T',' '):s+'（時間未定）'):'';
function isFuture(s){
  const t=s&&ivStart(s);if(!t||isNaN(t))return false;
  if(!hasTime(s))t.setDate(t.getDate()+1);// date-only counts as upcoming until the day ends
  return t>new Date();
}

/* ---------- Toast + undo ---------- */
let undoSnap=null;
function toast(msg,opt={}){
  const t=$('#toast'), b=$('#toastAct');
  $('#toastMsg').textContent=msg;
  b.hidden=!opt.undo;t.classList.toggle('has-act',!!opt.undo);
  b.textContent='復原';
  b.onclick=()=>{if(!undoSnap)return;data=JSON.parse(undoSnap);undoSnap=null;save();render();toast('已復原')};
  t.classList.add('show');clearTimeout(t._t);
  t._t=setTimeout(()=>{t.classList.remove('show');if(opt.undo)undoSnap=null},opt.undo?10000:2200);
}
function snapshot(){undoSnap=JSON.stringify(data)}

/* ---------- Interviews ---------- */
function ivText(iv){return [iv.round,(iv.when||'').replace('T',' '),iv.mode,iv.result].filter(Boolean).join(' ')+(iv.note?`（${iv.note}）`:'')}
function parseIvText(t){
  return String(t||'').split(/[；;\n]/).map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.match(/^(\S+)\s*(\d{4}-\d{2}-\d{2})?\s*(\d{1,2}:\d{2})?\s*(線上|現場|電話)?\s*(待面試|等結果|通過|未通過)?\s*(?:[（(](.*)[）)])?$/);
    if(!m)return {round:s,when:'',mode:'',result:'待面試',note:''};
    return {round:m[1],when:m[2]?(m[3]?m[2]+'T'+m[3].padStart(5,'0'):m[2]):'',mode:m[4]||'',result:m[5]||'待面試',note:m[6]||''};
  });
}
function nextInterview(d){return (d.interviews||[]).filter(x=>isFuture(x.when)).sort((a,b)=>a.when.localeCompare(b.when))[0]}
function currentInterview(d){const l=d.interviews||[];return nextInterview(d)||l[l.length-1]}

/* ---------- Status <-> interview link ---------- */
const PENDING=['待面試','等結果'];
const roundIdx=r=>{const i=ROUNDS.indexOf(r);return i<0?99:i};
// dated rounds in time order; undated ones fall back to the usual round order
function sortInterviews(l){return l.sort((a,b)=>a.when&&b.when?a.when.localeCompare(b.when):roundIdx(a.round)-roundIdx(b.round))}
const lastRound=d=>{const l=d.interviews||[];return l[l.length-1]};
function lastDone(d){return (d.interviews||[]).filter(x=>x.when&&!isFuture(x.when)).sort((a,b)=>a.when.localeCompare(b.when)).pop()}
const daysSinceIv=iv=>daysSince(iv.when.slice(0,10));
/*
  Status rules — one source of truth:
  1. A status the user picks (drag, dropdown, bulk, dialog) is final. Only the latest
     interview round is nudged so the two read consistently; the status itself is never changed.
  2. The status is derived from interviews ONLY while the user edits interviews in the dialog.
  3. Loading the page or restoring a backup never changes a status.
*/
function applyStatusToInterviews(d,S){
  const r=lastRound(d);if(!r)return;
  if(S==='未錄取'){if(PENDING.includes(r.result))r.result='未通過';return}
  if(S==='錄取'){r.result='通過';return}
  if(S==='等待結果'){if(r.result!=='通過')r.result='等結果';return}
  if(S==='面試中'){if(r.result==='未通過')r.result='待面試';return}
  // 已投遞 / 邀約洽談 / 無回應: keep the interview history exactly as it is
}
const OPEN=['已投遞','邀約洽談','面試中','等待結果'];
function deriveStatus(d){
  const l=d.interviews||[];if(!l.length)return;
  const r=lastRound(d), S=st(d.status).k;
  if(S==='錄取')return;
  if(r.result==='未通過'){d.status='未錄取';return}
  if(S==='未錄取'&&!PENDING.includes(r.result))return;
  d.status=r.result==='等結果'&&!nextInterview(d)?'等待結果':'面試中';
}
function normalizeRecord(d){
  if((d.interviews||[]).length)sortInterviews(d.interviews);
  return d;
}
const syncStatus=deriveStatus;// old name, kept so nothing breaks

/* ---------- Attention rules ---------- */
function attention(d){
  const S=st(d.status).k, out=[];
  if(CLOSED.includes(S))return out;
  const t=todayStr();
  if(d.nextDate&&d.nextDate<t)out.push({k:'over',t:'下一步已過期'});
  else if(d.nextDate===t)out.push({k:'today',t:'今天要處理'});
  const ds=daysSince(d.date);
  if(S==='已投遞'&&ds!==null&&ds>=14&&!(d.nextDate&&d.nextDate>=t))out.push({k:'over',t:'可追蹤'});
  if(S==='邀約洽談'&&ds!==null&&ds>=5)out.push({k:'over',t:'邀約待回覆'});
  if((d.interviews||[]).some(x=>x.result==='待面試'&&x.when&&!isFuture(x.when)))out.push({k:'today',t:'面試結果待更新'});
  const ld=lastDone(d);
  if(ld&&ld.result==='等結果'&&!nextInterview(d)){const n=daysSinceIv(ld);if(n>=7)out.push({k:'over',t:`已等 ${n} 天・可追蹤`})}
  return out;
}
// applied 30+ days ago, no interviews and nothing scheduled: probably a silent rejection
function ghost(d){
  const ds=daysSince(d.date);
  return st(d.status).k==='已投遞'&&ds!==null&&ds>=30&&!(d.interviews||[]).length&&!(d.nextDate&&d.nextDate>=todayStr());
}
// interviewed, then 14+ days without a result or anything scheduled
function ivGhost(d){
  if(!['面試中','等待結果'].includes(st(d.status).k)||nextInterview(d)||(d.nextDate&&d.nextDate>=todayStr()))return false;
  const ld=lastDone(d);
  return !!ld&&PENDING.includes(ld.result)&&daysSinceIv(ld)>=14;
}

/* ---------- Normalizers ---------- */
function serialToDate(v){return new Date(Math.round((+v-25569)*864e5))}
function normDate(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(v)){const d=serialToDate(v);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v).trim().replace(/[年月.]/g,'/').replace(/日/,'');
  const m=s.match(/^(\d{2,4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if(m){let y=+m[1];if(y<1911)y+=1911;return `${y}-${pad(m[2])}-${pad(m[3])}`}
  const d=new Date(s);return isNaN(d)?String(v):ymd(d);
}
function normDT(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(v)){
    const d=serialToDate(v), day=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
    return +v%1===0?day:`${day}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
  }
  const s=String(v).trim(), day=normDate(s.split(/\s+/)[0]);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return '';
  const t=s.match(/(\d{1,2})[:：](\d{2})/);
  if(!t)return day;// no time given: keep it date-only
  let h=+t[1];if(/下午|pm/i.test(s)&&h<12)h+=12;
  return `${day}T${pad(h)}:${t[2]}`;
}
function normStatus(v){
  v=String(v||'').trim();if(!v)return '已投遞';
  if(/錄取|offer|通過|accept/i.test(v)&&!/未|不|沒|reject/i.test(v))return '錄取';
  if(/未錄取|不錄取|拒|感謝函|reject|fail|沒上/i.test(v))return '未錄取';
  if(/等(待)?(結果|通知|回覆|回應|消息)|waiting|pending/i.test(v))return '等待結果';
  if(/面試|interview|測驗|筆試|一面|二面|三面/i.test(v))return '面試中';
  if(/無回應|沒回|no reply|ghost|石沉/i.test(v))return '無回應';
  if(/邀約|洽談|獵頭|聯繫|recruit/i.test(v))return '邀約洽談';
  return '已投遞';
}
function normOrigin(v){return /邀約|獵頭|找我|主動聯[繫絡]|被動|私訊|recruit|headhunt|inbound|invite/i.test(String(v||''))?'公司邀約':'主動投遞'}

/* ---------- Duplicate detection ---------- */
const normKey=s=>String(s||'').toLowerCase().replace(/\s+/g,'').replace(/[,.]*(股份有限公司|有限公司|inc|ltd|co|corp)[,.]*$/,'');
const dupKey=d=>`${normKey(d.company)}|${normKey(d.position)}|${d.date||''}`;
function mergeInto(target,src){
  FIELDS.forEach(f=>{if(src[f])target[f]=src[f]});
  const list=target.interviews||(target.interviews=[]);
  (src.interviews||[]).forEach(iv=>{
    const same=list.find(x=>x.round===iv.round);
    if(same)Object.keys(iv).forEach(k=>{if(iv[k])same[k]=iv[k]});else list.push(iv);
  });
}
function fillDefaults(o){
  if(!o.origin)o.origin='主動投遞';
  if(!o.status){
    o.status=o.origin==='公司邀約'?'邀約洽談':'已投遞';
    if((o.interviews||[]).length){sortInterviews(o.interviews);deriveStatus(o)}
  }
  return o;
}

<script>
/* ---------- Download helper ---------- */

/* ---------- XLSX writer (stored zip, inline strings) ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

    const nb=enc.encode(name), db=enc.encode(content), crc=crc32(db);

    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);

    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);

const xesc=s=>String(s??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Calendar (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n')}
function icsDT(s){return s.replace(/[-:]/g,'').slice(0,13)+'00'}
function icsEvent(d,iv){
  const allDay=!hasTime(iv.when), s0=ivStart(iv.when);
  let startL,endL;
  if(allDay){
    const e=new Date(s0);e.setDate(e.getDate()+1);

  }else{
    const end=new Date(s0.getTime()+36e5);

  }

  const desc=[d.position&&`職位：${d.position}`,d.contact&&`聯絡人：${d.contact}`,iv.note&&`筆記：${iv.note}`,allDay&&'時間未定',d.link].filter(Boolean).join('\n');
  return ['BEGIN:VEVENT',`UID:${d.id}-${iv.when.replace(/\D/g,'')}@job-log`,`DTSTAMP:${now}`,startL,endL,
    `SUMMARY:${icsEsc(`【面試】${d.company} ${iv.round}`)}`,`LOCATION:${icsEsc([iv.mode,d.location].filter(Boolean).join(' · '))}`,
    `DESCRIPTION:${icsEsc(desc)}`,'BEGIN:VALARM',`TRIGGER:${allDay?'-PT15H':'-PT1H'}`,'ACTION:DISPLAY',`DESCRIPTION:${icsEsc(d.company+' '+iv.round)}`,'END:VALARM','END:VEVENT'].join('\r\n');
}
function downloadICS(pairs,name){

}

/* ---------- Import ---------- */
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf), dec=new TextDecoder();
  let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('不是有效的 .xlsx 檔');
  const count=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<count;i++){
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!/^xl\/(sharedStrings|workbook|worksheets\/|_rels\/workbook)/.test(name))continue;
    const start=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    const raw=u8.subarray(start,start+csize);
    out[name]=method===0?dec.decode(raw):await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }

}
async function parseXLSX(buf){

  if(files['xl/workbook.xml']&&files['xl/_rels/workbook.xml.rels']){
    const first=xml(files['xl/workbook.xml']).getElementsByTagName('sheet')[0];
    const rid=first&&(first.getAttribute('r:id')||first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const rel=[...xml(files['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if(rel){const t=rel.getAttribute('Target').replace(/^\//,'');sheetPath=t.startsWith('xl/')?t:'xl/'+t}
  }
  if(!files[sheetPath])sheetPath=Object.keys(files).find(k=>/^xl\/worksheets\/.*\.xml$/.test(k));
  const doc=xml(files[sheetPath]);const out=[];
  const colIdx=ref=>{const L=ref.match(/^[A-Z]+/)[0];let n=0;for(const ch of L)n=n*26+ch.charCodeAt(0)-64;return n-1};
  [...doc.getElementsByTagName('row')].forEach(row=>{
    const r=+row.getAttribute('r')-1, arr=[];
    [...row.getElementsByTagName('c')].forEach(c=>{
      const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], ref=c.getAttribute('r');
      let val='';
      if(t==='s')val=shared[+v?.textContent]??'';
      else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(v){val=v.textContent;if(t!=='str'&&t!=='b'&&t!=='e'&&!isNaN(val))val=+val}
      arr[ref?colIdx(ref):arr.length]=val;

  });

function rowsToRecords(rows){

  FIELDS.forEach(f=>{if(map[f]===undefined){const i=head.findIndex((h,idx)=>!Object.values(map).includes(idx)&&ALIASES[f].some(a=>a.length>1&&h.includes(a)));if(i>-1)map[f]=i}});
  if(map.company===undefined&&map.position===undefined)throw new Error('找不到「公司」或「職位」欄位，請確認第一列是欄位名稱。');
  const used=new Set(Object.values(map));
  const ivLog=head.findIndex(h=>['面試紀錄','面試記錄','interviews','interview log'].includes(h));
  // columns like 一面 / 二面日期 / 面試日期 become interview rounds
  const ivCols=head.map((h,i)=>{if(used.has(i)||i===ivLog)return null;
    const m=h.match(/^(一|二|三|四|五|終|主管|hr)\s*面/i);if(m)return {i,round:m[1].toUpperCase()==='HR'?'HR面':m[1]+'面'};
    if(/^(面試日期|面試時間|interview date|interview)$/.test(h))return {i,round:'一面'};
    if(/筆試|測驗/.test(h))return {i,round:'筆試/測驗'};return null}).filter(Boolean);
  return rows.slice(1).map(r=>{const o={id:uid()};FIELDS.forEach(f=>o[f]=map[f]!==undefined?String(r[map[f]]??'').trim():'');
    o.date=normDate(map.date!==undefined?r[map.date]:'');o.nextDate=normDate(map.nextDate!==undefined?r[map.nextDate]:'');
    o.interviews=ivLog>-1?parseIvText(r[ivLog]):[];
    ivCols.forEach(c=>{const v=r[c.i];if(v===''||v==null)return;const when=normDT(v);
      o.interviews.push({round:c.round,when,mode:'',result:isFuture(when)?'待面試':'等結果',note:when?'':String(v)})});
    const rm=String(o.status).match(/(一|二|三|四|終|主管|HR)面/i);
    if(rm&&!o.interviews.length)o.interviews.push({round:rm[0],when:'',mode:'',result:'待面試',note:''});
    // the backup's status is trusted as-is; it is only derived when the column is blank
    const rawStatus=o.status;o.status=rawStatus?normStatus(rawStatus):'';
    o.origin=(map.origin!==undefined&&o.origin)||normOrigin(o.channel)==='公司邀約'?normOrigin(o.origin||o.channel):'';
    return o}).filter(o=>o.company||o.position);
}
// the Excel file is the source of truth: importing replaces everything
function importRecords(incoming){
  // collapse duplicate rows inside the file itself
  const uniq=new Map();
  incoming.forEach(o=>{const k=dupKey(o);if(uniq.has(k))mergeInto(uniq.get(k),o);else uniq.set(k,o)});
  incoming=[...uniq.values()];
  if(data.length&&!confirm(`要從這個備份還原嗎？\n\n網頁上現有的 ${data.length} 筆紀錄，會換成備份檔裡的 ${incoming.length} 筆。\n（還原後 10 秒內可以按「復原」）`))return;
  snapshot();
  data=incoming.map(o=>normalizeRecord(fillDefaults(o)));
  finishImport(`已從備份還原 ${data.length} 筆`);
}
function finishImport(msg){save();filter=null;attnOnly=false;page=1;selected.clear();render();toast(msg,{undo:true})}

<script>
/* ---------- Filtering & sorting ---------- */
function matches(d,q){
  return FIELDS.some(f=>String(d[f]||'').toLowerCase().includes(q))||(d.interviews||[]).some(iv=>ivText(iv).toLowerCase().includes(q));
}
function getRows(keepClosed){
  const q=$('#q').value.trim().toLowerCase(), of=$('#originF').value;
  // default (no card picked) = 進行中: closed records stay hidden unless 全部 or a status card is picked
  const hide=!keepClosed&&!filter&&!ghostOnly;
  const base=data.filter(d=>(!filter||filter==='ALL'||st(d.status).k===filter)&&(!attnOnly||attention(d).length)&&(!ghostOnly||ghost(d)||ivGhost(d))&&(!of||org(d)===of)&&(!q||matches(d,q)));
  const rows=hide?base.filter(d=>!CLOSED.includes(st(d.status).k)):base;
  hiddenClosed=base.length-rows.length;
  const val={
    company:d=>d.company||'', channel:d=>d.channel||'', date:d=>d.date||'',
    status:d=>STATUSES.indexOf(st(d.status)), nextDate:d=>d.nextDate||((nextInterview(d)||{}).when||'').slice(0,10),
    interview:d=>{const c=currentInterview(d);return c&&c.when||''}
  }[sortKey];
  rows.sort((a,b)=>{
    const x=val(a), y=val(b);
    if(typeof x==='string'){if(!x&&y)return 1;if(x&&!y)return -1;return x.localeCompare(y,'zh-Hant')*sortDir}
    return (x-y)*sortDir;
  });

}

/* ---------- Table ---------- */
function ivCell(d){

const flagsHTML=d=>attention(d).map(a=>`<span class="flag ${a.k==='today'?'today':''}">${a.t}</span>`).join('');

function renderTable(rows){
  document.querySelectorAll('th[data-sort]').forEach(th=>{th.classList.toggle('asc',th.dataset.sort===sortKey&&sortDir===1);th.classList.toggle('desc',th.dataset.sort===sortKey&&sortDir===-1)});

    $('#tbody').innerHTML=`<tr><td colspan="10"><div class="empty"><div class="big">${data.length?'沒有符合的紀錄':'還沒有任何投遞紀錄'}</div>${hiddenClosed?`另有 ${hiddenClosed} 筆已結束的紀錄，點上方「全部」卡片就能看到`:data.length?'換個關鍵字或篩選試試':'按「新增投遞」開始記錄，或從之前的備份還原'}</div></td></tr>`;

    </tr>`}).join('');
  document.querySelectorAll('select.pill').forEach(el=>el.onchange=()=>setStatus(el.dataset.id,el.value));
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>openDlg(el.dataset.edit));

function setStatus(id,v){

function renderPager(total,pages,from){

/* ---------- Kanban ---------- */
const KB_CLOSED_LIMIT=5;
const kbExpanded=new Set();
let kbTab=null;// which column the phone layout shows

/* ---------- Analytics ---------- */
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const interviewed=d=>(d.interviews||[]).length>0||['面試中','等待結果','錄取'].includes(st(d.status).k);
const replied=d=>!['已投遞','無回應'].includes(st(d.status).k)||interviewed(d);
function renderAnalytics(rows){
  visibleIds=[];updateBulk();
  if(!rows.length){$('#analytics').innerHTML='<div class="panel full"><div class="empty"><div class="big">還沒有資料可以分析</div>新增或匯入紀錄後，這裡會顯示投遞成效。</div></div>';return}
  const N=rows.length, rep=rows.filter(replied).length, iv=rows.filter(interviewed).length, ok=rows.filter(d=>st(d.status).k==='錄取').length;
  const funnel=[['全部機會',N,''],['有回音',rep,pct(rep,N)+' 回覆率'],['進入面試',iv,pct(iv,N)+' 面試率'],['錄取',ok,pct(ok,N)+' 錄取率']];

  // by channel: top 8, rest folded into 其他
  const byCh={};rows.forEach(d=>{const k=d.channel||'（未填）';(byCh[k]||(byCh[k]={n:0,iv:0,ok:0})).n++;if(interviewed(d))byCh[k].iv++;if(st(d.status).k==='錄取')byCh[k].ok++});
  let ch=Object.entries(byCh).sort((a,b)=>b[1].n-a[1].n);
  if(ch.length>8){const rest=ch.slice(7).reduce((s,[,v])=>({n:s.n+v.n,iv:s.iv+v.iv,ok:s.ok+v.ok}),{n:0,iv:0,ok:0});ch=[...ch.slice(0,7),['其他',rest]]}
  const maxN=Math.max(...ch.map(([,v])=>v.n));

  // weekly volume, last 12 weeks (weeks start Monday)
  const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const weeks=[...Array(12)].map((_,i)=>{const s=new Date(mon);s.setDate(s.getDate()-7*(11-i));const e=new Date(s);e.setDate(e.getDate()+7);
    const list=rows.filter(d=>{const t=parseDay(d.date);return t&&t>=s&&t<e});
    return {s,n:list.length,inb:list.filter(d=>org(d)==='公司邀約').length}});
  const maxW=Math.max(1,...weeks.map(w=>w.n));

  const byOrg=['主動投遞','公司邀約'].map(o=>{const l=rows.filter(d=>org(d)===o);return [o,l.length,l.filter(interviewed).length,l.filter(d=>st(d.status).k==='錄取').length]});
  const byRound={};rows.forEach(d=>(d.interviews||[]).forEach(x=>{const r=byRound[x.round]||(byRound[x.round]={n:0,pass:0,fail:0});r.n++;if(x.result==='通過')r.pass++;if(x.result==='未通過')r.fail++}));
  const roundRows=ROUNDS.filter(r=>byRound[r]).concat(Object.keys(byRound).filter(r=>!ROUNDS.includes(r)));

  $('#analytics').innerHTML=`
    <div class="panel full"><h3>投遞漏斗</h3><p class="desc">全部 ${N} 筆紀錄，不受上方卡片、搜尋和來源篩選影響。百分比都是相對於全部機會。</p>
      <div class="funnel">${funnel.map(([l,n,r])=>`<div class="fstep"><div class="n">${n}</div><div class="l">${l}</div>${r?`<div class="r">${r}</div>`:''}</div>`).join('')}</div></div>
    <div class="panel"><h3>哪個管道最有效</h3><p class="desc">淺色是總筆數，深色是其中進到面試的筆數。</p>
      <div class="legend"><span><i style="background:#c9d9ce"></i>總筆數</span><span><i style="background:var(--green)"></i>進入面試</span></div>
      ${ch.map(([k,v])=>`<div class="hbar" data-tip="${esc(k)}：${v.n} 筆，面試 ${v.iv}（${pct(v.iv,v.n)}），錄取 ${v.ok}">
        <div class="nm">${esc(k)}</div>
        <div class="track"><div class="fill ghost" style="width:${v.n/maxN*100}%"></div><div class="fill" style="width:${v.iv/maxN*100}%"></div></div>
        <div class="v">${v.n} 筆 · ${pct(v.iv,v.n)}</div></div>`).join('')}</div>
    <div class="panel"><h3>每週新增機會</h3><p class="desc">最近 12 週，依投遞／聯繫日期計算。滑鼠移到長條上看細節。</p>
      <div class="weeks">${weeks.map((w,i)=>`<div class="wk" data-tip="${w.s.getMonth()+1}/${w.s.getDate()} 那週：${w.n} 筆${w.inb?`（含邀約 ${w.inb}）`:''}">
        <div class="b" style="height:${w.n/maxW*100}%"></div>${i%2===1||i===11?`<span class="lbl">${w.s.getMonth()+1}/${w.s.getDate()}</span>`:''}</div>`).join('')}</div>
      <div style="height:24px"></div></div>
    <div class="panel"><h3>主動投遞 vs 公司邀約</h3><p class="desc">看哪一種來源比較容易走到面試與錄取。</p>
      <table class="an-table"><thead><tr><th>來源</th><th>筆數</th><th>面試率</th><th>錄取率</th></tr></thead>
      <tbody>${byOrg.map(([o,n,i,k])=>`<tr><td>${o}</td><td>${n}</td><td>${pct(i,n)}</td><td>${pct(k,n)}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h3>各輪面試結果</h3><p class="desc">通過率只算已經有結果（通過或未通過）的場次。</p>
      ${roundRows.length?`<table class="an-table"><thead><tr><th>輪次</th><th>場次</th><th>通過</th><th>未通過</th><th>通過率</th></tr></thead>
      <tbody>${roundRows.map(r=>{const v=byRound[r];return `<tr><td>${esc(r)}</td><td>${v.n}</td><td>${v.pass}</td><td>${v.fail}</td><td>${pct(v.pass,v.pass+v.fail)}</td></tr>`}).join('')}</tbody></table>`:'<p class="desc">還沒有面試紀錄。</p>'}</div>`;
}

/* ---------- Tooltip ---------- */
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]'), tip=$('#tip');
  if(!t){tip.classList.remove('show');return}
  tip.textContent=t.dataset.tip;tip.classList.add('show');
  const w=tip.offsetWidth;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+'px';tip.style.top=(e.clientY+16)+'px';
});

/* ---------- Main render ---------- */
function render(){
  [...selected].forEach(id=>{if(!data.some(d=>d.id===id))selected.delete(id)});
  // the "long silence" view is a one-off: drop it once nothing matches any more
  if(ghostOnly&&!data.some(d=>ghost(d)||ivGhost(d)))ghostOnly=false;
  renderStats();renderUpcoming();renderBackup();renderSuggest();
  // the table and board follow the cards and filters; analytics always uses every record
  const rows=getRows(view==='stats');
  document.body.classList.toggle('v-stats',view==='stats');
  $('#vTable').hidden=view!=='table';$('#vKanban').hidden=view!=='kanban';$('#vStats').hidden=view!=='stats';
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  // analytics always looks at every record, regardless of cards, search or source filter
  if(view==='table')renderTable(rows);else if(view==='kanban')renderKanban(rows);else renderAnalytics(data);
}
</script>
<script>
/* ---------- Edit dialog ---------- */
$('#statusSel').innerHTML=STATUSES.map(s=>`<option>${s.k}</option>`).join('');
const opts=(list,v)=>list.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
function ivRowHTML(iv){
  const rounds=ROUNDS.includes(iv.round)||!iv.round?ROUNDS:[iv.round,...ROUNDS];
  return `<div class="iv-row">
    <select data-k="round">${opts(rounds,iv.round)}</select>
    <input type="date" data-k="d" value="${esc((iv.when||'').slice(0,10))}">
    <input type="time" data-k="t" value="${esc(hasTime(iv.when)?iv.when.slice(11,16):'')}" title="時間不確定可以留空">
    <select data-k="mode"><option value="">形式</option>${opts(MODES,iv.mode)}</select>
    <select data-k="result">${opts(RESULTS,iv.result||'待面試')}</select>
    <input data-k="note" placeholder="面試官、考題、心得…" value="${esc(iv.note||'')}">
    <button type="button" class="ic cal" title="下載這場面試的行事曆檔">📅</button>
    <button type="button" class="ic rm" title="移除這輪">✕</button>
  </div>`;
}
function renderIvList(list){
  $('#ivList').innerHTML=list.length?list.map(ivRowHTML).join(''):'<div class="iv-empty">還沒有面試紀錄。收到面試通知時按「新增一輪」。</div>';
  $('#ivList').querySelectorAll('.rm').forEach((b,i)=>b.onclick=()=>{const l=readIvList();l.splice(i,1);renderIvList(l);liveSync()});
  $('#ivList').querySelectorAll('[data-k=result]').forEach(s=>s.onchange=liveSync);
  $('#ivList').querySelectorAll('.cal').forEach((b,i)=>b.onclick=()=>{
    const iv=readIvList()[i], f=$('#form').elements;
    if(!iv.when)return toast('先填這一輪的日期時間');
    const d={id:editingId||'new',company:f.company.value,position:f.position.value,location:f.location.value,contact:f.contact.value,link:f.link.value};
    downloadICS([{d,iv}],`面試_${d.company||'未命名'}_${iv.round}.ics`);
  });
}
function readIvList(){
  return [...$('#ivList').querySelectorAll('.iv-row')].map(r=>{
    const o={};r.querySelectorAll('[data-k]').forEach(el=>o[el.dataset.k]=el.value.trim());
    o.when=o.d?(o.t?`${o.d}T${o.t}`:o.d):'';delete o.d;delete o.t;
    return o;
  });
}
$('#ivAdd').onclick=()=>{
  const l=readIvList(), used=l.map(x=>x.round);
  const nextRound=['一面','二面','三面','四面','終面'].find(r=>!used.includes(r))||'終面';
  l.push({round:nextRound,when:'',mode:'',result:'待面試',note:''});renderIvList(l);liveSync();
  $('#ivList').querySelector('.iv-row:last-child input[type=date]').focus();
};
// keep the status dropdown and the interview results in step while editing
function liveSync(){
  const tmp={status:$('#statusSel').value,interviews:readIvList().filter(x=>x.round||x.when)};
  deriveStatus(tmp);$('#statusSel').value=st(tmp.status).k;
}
$('#statusSel').onchange=()=>{
  const tmp={interviews:readIvList()};
  applyStatusToInterviews(tmp,$('#statusSel').value);renderIvList(tmp.interviews);
};
function syncOrigin(swapStatus){
  const f=$('#form'), inb=f.elements.origin.value==='公司邀約';
  $('#dateLab').textContent=inb?'對方聯繫日期':'投遞日期';
  $('#chLab').textContent=inb?'從哪裡找到我':'投遞管道';
  f.elements.channel.placeholder=inb?'LinkedIn 私訊、獵頭、104 邀約…':'104、LinkedIn、內推…';
  $('#ctLab').textContent=inb?'聯絡人（HR／獵頭）':'聯絡人';
  $('#dlgTitle').classList.toggle('inbound',inb);
  if(!swapStatus)return;
  // flip the default status along with the origin toggle
  const s=f.elements.status;
  if(inb&&s.value==='已投遞')s.value='邀約洽談';
  if(!inb&&s.value==='邀約洽談')s.value='已投遞';
}
document.querySelectorAll('input[name=origin]').forEach(r=>r.onchange=()=>syncOrigin(true));
function openDlg(id,origin){
  editingId=id||null;
  const f=$('#form'), inb=origin==='公司邀約';
  const d=id?data.find(x=>x.id===id):{date:todayStr(),origin:inb?'公司邀約':'主動投遞',status:inb?'邀約洽談':'已投遞'};
  FIELDS.forEach(k=>f.elements[k].value=k==='origin'?org(d):k==='status'?st(d.status).k:(d[k]||''));
  renderIvList((d.interviews||[]).map(x=>({...x})));
  syncOrigin();
  $('#dlgTitle').textContent=id?(org(d)==='公司邀約'?'編輯公司邀約':'編輯投遞'):(inb?'新增公司邀約':'新增投遞');
  $('#delBtn').style.visibility=id?'visible':'hidden';
  $('#dlg').showModal();
}
$('#addBtn').onclick=()=>openDlg();
$('#addInBtn').onclick=()=>openDlg(null,'公司邀約');
$('#cancelBtn').onclick=()=>$('#dlg').close();
$('#delBtn').onclick=()=>{
  const r=data.find(x=>x.id===editingId);snapshot();
  data=data.filter(x=>x.id!==editingId);save();$('#dlg').close();render();toast(`已刪除 ${r?r.company:''}`,{undo:true});
};
$('#form').onsubmit=e=>{
  const f=e.target, o={};FIELDS.forEach(k=>o[k]=f.elements[k].value.trim());
  o.interviews=sortInterviews(readIvList().filter(x=>x.round||x.when));
  // the dropdown already reflects both the live interview sync and any manual pick, so it is final
  applyStatusToInterviews(o,o.status);
  if(!editingId){
    const dup=data.find(d=>dupKey(d)===dupKey(o));
    if(dup&&!confirm(`已經有一筆「${dup.company}／${dup.position}」（${dup.date||'無日期'}）。\n還是要另外新增一筆嗎？`)){e.preventDefault();return}
  }
  snapshot();
  if(editingId)Object.assign(data.find(x=>x.id===editingId),o);else data.push({id:uid(),...o});
  save();render();toast('已儲存',{undo:true});
};

/* ---------- Bulk actions ---------- */
$('#bulkStatus').innerHTML+=STATUSES.map(s=>`<option>${s.k}</option>`).join('');
function updateBulk(){
  const n=selected.size, vis=visibleIds.filter(id=>selected.has(id)).length;
  $('#bulk').classList.toggle('show',n>0);
  $('#bulkCnt').textContent=`已選 ${n} 筆`;
  const all=$('#ckAll');all.checked=visibleIds.length>0&&vis===visibleIds.length;all.indeterminate=vis>0&&vis<visibleIds.length;
}
$('#ckAll').onchange=e=>{visibleIds.forEach(id=>e.target.checked?selected.add(id):selected.delete(id));render()};
const picked=()=>data.filter(d=>selected.has(d.id));
function bulkDone(msg,undo=true){selected.clear();save();render();toast(msg,{undo})}
let bulkApply=null;
function openBulk(title,body,apply){
  $('#bTitle').textContent=title;$('#bBody').innerHTML=body;bulkApply=apply;
  $('#bdlg').showModal();const first=$('#bBody').querySelector('input,textarea');if(first)first.focus();
}
$('#bCancel').onclick=()=>$('#bdlg').close();
$('#bform').onsubmit=()=>{const el=$('#bform').elements;snapshot();bulkApply(el)};
$('#bulkStatus').onchange=e=>{
  const v=e.target.value;e.target.value='';if(!v)return;
  const n=selected.size;snapshot();picked().forEach(d=>{applyStatusToInterviews(d,v);d.status=v});bulkDone(`${n} 筆 → ${v}`);
};
$('#bulkChannel').onclick=()=>openBulk(`改 ${selected.size} 筆的管道`,
  `<label>管道<input name="ch" list="channels" placeholder="104、LinkedIn、內推…"></label>`,
  el=>{picked().forEach(d=>d.channel=el.ch.value.trim());bulkDone('已更新管道')});
$('#bulkNext').onclick=()=>openBulk(`設定 ${selected.size} 筆的下一步`,
  `<label>下一步<input name="nx" placeholder="例：寄感謝信、追蹤進度"></label><label>日期（可留空）<input type="date" name="nd" value="${todayStr()}"></label>`,
  el=>{picked().forEach(d=>{d.next=el.nx.value.trim();d.nextDate=el.nd.value});bulkDone('已設定下一步')});
$('#bulkNote').onclick=()=>openBulk(`在 ${selected.size} 筆的備註後面加上`,
  `<label>要加的文字<textarea name="nt" placeholder="原本的備註會保留，這段會加在後面"></textarea></label>`,
  el=>{const v=el.nt.value.trim();if(!v)return;picked().forEach(d=>d.note=d.note?`${d.note}\n${v}`:v);bulkDone('已加上備註')});
$('#bulkExport').onclick=()=>{if(exportRows(picked(),'選取'))bulkDone('已匯出選取的紀錄',false)};
$('#bulkDel').onclick=()=>{
  const n=selected.size;snapshot();data=data.filter(d=>!selected.has(d.id));bulkDone(`已刪除 ${n} 筆`);
};
$('#bulkClear').onclick=()=>{selected.clear();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected.size&&!$('#dlg').open&&!$('#bdlg').open){selected.clear();render()}});

/* ---------- Toolbar, sorting, views ---------- */
$('#q').oninput=()=>{page=1;render()};
$('#originF').onchange=()=>{page=1;render()};

/* ---------- "No reply" suggestion ---------- */
$('#suggApply').onclick=()=>{
  const a=data.filter(ghost), b=data.filter(ivGhost);if(!a.length&&!b.length)return;
  snapshot();
  a.forEach(d=>d.status='無回應');
  b.forEach(d=>{applyStatusToInterviews(d,'未錄取');d.status='未錄取'});
  save();ghostOnly=false;render();
  toast([a.length&&`${a.length} 筆改成無回應`,b.length&&`${b.length} 筆改成未錄取`].filter(Boolean).join('、'),{undo:true});
};
$('#suggView').onclick=()=>{ghostOnly=true;filter=null;attnOnly=false;view='table';page=1;render()};
$('#suggLater').onclick=()=>{localStorage.setItem(KEY+'-ghostSnooze',Date.now()+3*864e5);renderSuggest()};

/* ---------- Offer comparison ---------- */
function openCompare(){
  const offers=data.filter(d=>st(d.status).k==='錄取');
  if(!offers.length)return toast('目前還沒有錄取的紀錄');
  const rowsDef=[
    ['職位',d=>esc(d.position)],
    ['薪資',d=>d.salary?`<span class="money">${esc(d.salary)}</span>`:'<span class="sub">未填</span>'],
    ['地點',d=>esc(d.location||'—')],
    ['來源',d=>`${org(d)}${d.channel?'<br><span class="sub">'+esc(d.channel)+'</span>':''}`],
    ['面試過程',d=>(d.interviews||[]).length?(d.interviews||[]).map(x=>`${esc(x.round)}${x.result?' · '+esc(x.result):''}`).join('<br>'):'—'],
    ['聯絡人',d=>esc(d.contact||'—')],
    ['下一步',d=>esc(d.next||'—')+(d.nextDate?`<br><span class="sub">${esc(d.nextDate)}</span>`:'')],
    ['備註',d=>esc(d.note||'—')],
    ['連結',d=>d.link?`<a href="${esc(d.link)}" target="_blank" rel="noopener">職缺頁面 ↗</a>`:'—']
  ];
  $('#cmpBody').innerHTML=`<table class="cmp"><thead><tr><th></th>${offers.map(d=>`<th><a href="#" data-cmp="${d.id}" style="color:inherit">${esc(d.company)}</a></th>`).join('')}</tr></thead>
    <tbody>${rowsDef.map(([l,f])=>`<tr><th>${l}</th>${offers.map(d=>`<td>${f(d)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('#cmpBody').querySelectorAll('[data-cmp]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#cdlg').close();openDlg(a.dataset.cmp)});
  $('#cdlg').showModal();
}
document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=k==='date'?-1:1}
  page=1;render();
});
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{view=b.dataset.v;localStorage.setItem(KEY+'-view',view);selected.clear();render()});
view=localStorage.getItem(KEY+'-view')||'table';

/* ---------- Import / export / backup ---------- */
$('#exportBtn').onclick=()=>{if(exportRows(data)){toast('已備份到 Excel，記得把檔案存在安全的地方');renderBackup()}};
$('#backupNow').onclick=()=>{if(exportRows(data)){renderBackup();toast('備份完成')}};
$('#backupLater').onclick=()=>{localStorage.setItem(KEY+'-snooze',Date.now()+864e5);renderBackup()};
$('#fileIn').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const rows=file.name.toLowerCase().endsWith('.csv')?parseCSV(await file.text()):await parseXLSX(await file.arrayBuffer());
    importRecords(rowsToRecords(rows));
  }catch(err){console.error(err);alert('還原失敗：'+err.message+'\n請選擇用「備份到 Excel」存下來的 .xlsx 檔。')}
};

// bring saved records in line with the status/interview rules
data.forEach(normalizeRecord);save();
render();
</script>
</body>
